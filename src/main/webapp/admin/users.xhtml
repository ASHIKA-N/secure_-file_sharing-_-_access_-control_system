<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" template="template.xhtml">
<ui:define name="content"><h1>User Management</h1><h:form id="users"><input type="hidden" name="csrf" value="#{sessionScope.csrf}"/><h:inputHidden value="#{adminBean.page}"/>
<label for="users:search">Search name or email</label><h:inputText id="search" value="#{adminBean.search}" maxlength="100"/><h:commandButton value="Search" action="#{adminBean.search}"/>
<h:panelGroup id="results" layout="block"><p role="status"><h:outputText value="#{adminBean.message}"/></p><div class="table-wrap"><h:dataTable value="#{adminBean.users}" var="u">
<h:column><f:facet name="header">Name</f:facet><h:outputText value="#{u.name}"/></h:column><h:column><f:facet name="header">Email</f:facet><h:outputText value="#{u.email}"/></h:column><h:column><f:facet name="header">Role</f:facet><h:outputText value="#{u.role}"/></h:column><h:column><f:facet name="header">Status</f:facet><h:outputText value="#{u.active ? 'Active' : 'Disabled'}"/></h:column>
<h:column><f:facet name="header">Action</f:facet><h:commandButton value="#{u.active ? 'Disable' : 'Activate'}" action="#{adminBean.toggle(u.id, not u.active)}" rendered="#{u.role ne 'ADMIN'}" onclick="return confirm('Change this account status?')"><f:ajax execute="@form" render="@form"/></h:commandButton></h:column></h:dataTable></div>
<p class="pagination"><h:commandButton value="Previous" action="#{adminBean.previous}" disabled="#{adminBean.page eq 0}"/><h:outputText value="Page #{adminBean.page+1}"/><h:commandButton value="Next" action="#{adminBean.next}" disabled="#{adminBean.users.size() lt 20}"/></p><h:panelGroup rendered="#{empty adminBean.users}"><p>No accounts found.</p></h:panelGroup></h:panelGroup></h:form></ui:define></ui:composition>
