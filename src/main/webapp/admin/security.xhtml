<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" template="template.xhtml"><ui:define name="content"><h1>Security Alerts</h1><p>Rule-based alerts indicate unusual activity, not confirmed abuse. Accounts are not disabled automatically. Each account/rule/scope is deduplicated during the configured cooldown.</p><h:form id="alerts"><input type="hidden" name="csrf" value="#{sessionScope.csrf}"/><h:inputHidden value="#{adminBean.page}"/><p role="status"><h:outputText value="#{adminBean.message}"/></p><div class="table-wrap"><h:dataTable value="#{adminBean.alerts}" var="a"><h:column><f:facet name="header">Actor</f:facet><h:outputText value="#{a.actor}"/></h:column><h:column><f:facet name="header">Rule</f:facet><h:outputText value="#{a.rule}"/></h:column><h:column><f:facet name="header">Count / window</f:facet><h:outputText value="#{a.count} in #{a.window} seconds"/></h:column><h:column><f:facet name="header">Time (UTC)</f:facet><h:outputText value="#{a.createdAt}"/></h:column><h:column><f:facet name="header">Status</f:facet><h:outputText value="#{a.status}"/></h:column><h:column><f:facet name="header">Review</f:facet><h:commandButton value="Acknowledge" action="#{adminBean.acknowledge(a.id)}" rendered="#{a.status eq 'OPEN'}"/><h:commandButton value="Resolve" action="#{adminBean.resolve(a.id)}" rendered="#{a.status ne 'RESOLVED'}"/></h:column></h:dataTable></div><h:panelGroup rendered="#{empty adminBean.alerts}"><p>No alerts found.</p></h:panelGroup><h:commandButton value="Previous" action="#{adminBean.previous}" disabled="#{adminBean.page eq 0}"/><h:outputText value="Page #{adminBean.page+1}"/><h:commandButton value="Next" action="#{adminBean.next}" disabled="#{adminBean.alerts.size() lt 20}"/></h:form></ui:define></ui:composition>
