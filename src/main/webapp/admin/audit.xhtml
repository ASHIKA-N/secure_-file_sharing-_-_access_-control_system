<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" template="template.xhtml">
<ui:define name="content"><h1>Audit Records</h1><p>Read-only activity metadata. Date filters use UTC, including the selected end date.</p><h:form id="audit"><input type="hidden" name="csrf" value="#{sessionScope.csrf}"/><h:inputHidden value="#{adminBean.page}"/>
<div class="toolbar"><label>Actor email<h:inputText value="#{adminBean.actor}" maxlength="254"/></label><label>Action<h:inputText value="#{adminBean.action}" maxlength="40"/></label><label>Outcome<h:selectOneMenu value="#{adminBean.outcome}"><f:selectItem itemValue="" itemLabel="All"/><f:selectItem itemValue="SUCCESS" itemLabel="Success"/><f:selectItem itemValue="DENIED" itemLabel="Denied"/></h:selectOneMenu></label><label>From (YYYY-MM-DD)<h:inputText value="#{adminBean.from}" maxlength="10"/></label><label>To (YYYY-MM-DD)<h:inputText value="#{adminBean.to}" maxlength="10"/></label><h:commandButton value="Filter" action="#{adminBean.search}"/></div>
<p role="status"><h:outputText value="#{adminBean.message}"/></p><div class="table-wrap"><h:dataTable value="#{adminBean.logs}" var="a"><h:column><f:facet name="header">Time (UTC)</f:facet><h:outputText value="#{a.occurredAt}"/></h:column><h:column><f:facet name="header">Actor</f:facet><h:outputText value="#{a.actor}"/></h:column><h:column><f:facet name="header">Action</f:facet><h:outputText value="#{a.action}"/></h:column><h:column><f:facet name="header">Outcome</f:facet><h:outputText value="#{a.outcome}"/></h:column><h:column><f:facet name="header">Reason</f:facet><h:outputText value="#{a.reason}"/></h:column><h:column><f:facet name="header">File ID</f:facet><h:outputText value="#{a.file}"/></h:column></h:dataTable></div><h:panelGroup rendered="#{empty adminBean.logs}"><p>No records match these filters.</p></h:panelGroup>
<p class="pagination"><h:commandButton value="Previous" action="#{adminBean.previous}" disabled="#{adminBean.page eq 0}"/><h:outputText value="Page #{adminBean.page+1}"/><h:commandButton value="Next" action="#{adminBean.next}" disabled="#{adminBean.logs.size() lt 20}"/></p></h:form></ui:define></ui:composition>
